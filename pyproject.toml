[project]
name = "fourier"
version = "0.1.0"
description = "Exploring Fourier series reconstruction of audio clips"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
]

[project.scripts]
fourier = "fourier.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
